services:
  mysql:
    image: mysql:8.4
    container_name: reading-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-reading_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reading_agent}
      MYSQL_USER: ${MYSQL_USER:-reading}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reading_pass}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: reading-elasticsearch
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP_SIZE:-1g} -Xmx${ES_HEAP_SIZE:-1g}"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 45s

  backend:
    build:
      context: ./backend
    container_name: reading-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-reading_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-reading}
      DB_PASSWORD: ${MYSQL_PASSWORD:-reading_pass}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-openai}
      AI_MODEL_EMBEDDING: ${AI_MODEL_EMBEDDING:-openai}
      AI_VECTORSTORE_TYPE: ${AI_VECTORSTORE_TYPE:-elasticsearch}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      SPRING_AUTOCONFIGURE_EXCLUDE: ${SPRING_AUTOCONFIGURE_EXCLUDE:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_CHAT_COMPLETIONS_PATH: ${QWEN_CHAT_COMPLETIONS_PATH:-/chat/completions}
      QWEN_EMBEDDINGS_PATH: ${QWEN_EMBEDDINGS_PATH:-/embeddings}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8088,http://127.0.0.1:8088}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: reading-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_BIND:-127.0.0.1}:${APP_PORT:-8088}:80"

volumes:
  mysql-data:
  es-data:
